name: upstream-drift
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check upstream GitHub repositories in provenance.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const prov = JSON.parse(fs.readFileSync("provenance.json", "utf8")).skills;
            const repos = [...new Set(Object.values(prov).filter(s => s.sourceType === "github" && s.source.includes("/")).map(s => s.source))].sort();
            (async () => {
              const rows = ["| Upstream Repo | Latest HEAD SHA | Upstream License | Status |", "| :--- | :--- | :--- | :--- |"];
              for (const repo of repos) {
                const headers = { "User-Agent": "skills-v2-upstream-check", Accept: "application/vnd.github+json" };
                if (process.env.GITHUB_TOKEN) headers.Authorization = `Bearer ${process.env.GITHUB_TOKEN}`;
                const res = await fetch(`https://api.github.com/repos/${repo}`, { headers });
                if (!res.ok) {
                  rows.push(`| \`${repo}\` | n/a | n/a | HTTP ${res.status} |`);
                  continue;
                }
                const meta = await res.json();
                const branch = meta.default_branch || "main";
                const cRes = await fetch(`https://api.github.com/repos/${repo}/commits/${branch}`, { headers });
                const cJson = cRes.ok ? await cRes.json() : {};
                const sha = cJson.sha ? cJson.sha.slice(0, 12) : "n/a";
                const lic = meta.license?.spdx_id || "unlisted";
                rows.push(`| \`${repo}\` | \`${sha}\` | ${lic} | reachable |`);
              }
              const table = rows.join("\n") + "\n";
              console.log(table);
              if (process.env.GITHUB_STEP_SUMMARY) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Upstream Repository Status\n\n" + table);
              }
            })();
          '
