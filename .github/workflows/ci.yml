name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [minimal, all]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install tool dependencies
        run: npm install --no-audit --no-fund
        working-directory: tools/codex
      - name: Validate Codex edition
        run: node tools/codex/validate.mjs --source
      - name: Validate Claude Code edition
        run: node tools/claude/validate.mjs --source
      - name: Check provenance
        run: node tools/provenance.mjs --check
      - name: Scan skills for remote-execution patterns
        run: node tools/scan-skills.mjs
      - name: Lint skill descriptions and length
        run: node tools/lint-skills.mjs
      - name: Check README is generated from the repo
        run: node tools/readme-sync.mjs --check
      - name: Install Codex edition (${{ matrix.profile }})
        run: node tools/codex/install.mjs --target "${{ runner.temp }}/codex-${{ matrix.profile }}" --profile ${{ matrix.profile }}
      - name: Install Claude Code edition (${{ matrix.profile }})
        run: node tools/claude/install.mjs --target "${{ runner.temp }}/claude-${{ matrix.profile }}" --profile ${{ matrix.profile }}
      - name: Verify remaining profiles on Ubuntu (frontend, backend, security, fullstack)
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'all'
        run: |
          for p in frontend backend security fullstack; do
            node tools/codex/install.mjs --target "${{ runner.temp }}/codex-$p" --profile "$p"
            node tools/claude/install.mjs --target "${{ runner.temp }}/claude-$p" --profile "$p"
          done
      - name: Verify Designer mode and unified install.mjs on Ubuntu
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'all'
        run: |
          node tools/codex/install.mjs --target "${{ runner.temp }}/codex-designer" --profile minimal --mode designer
          node tools/claude/install.mjs --target "${{ runner.temp }}/claude-designer" --profile minimal --mode designer
          node install.mjs --edition agy --mode designer --target "${{ runner.temp }}/agy-designer" --dry-run
          node -e "const fs=require('fs'),p=require('path'),t=process.env.RUNNER_TEMP; for(const [m,r] of [['codex-designer/.codex/codex-install.json','codex-designer/AGENTS.md'],['claude-designer/.claude/claude-install.json','claude-designer/CLAUDE.md']]){const j=JSON.parse(fs.readFileSync(p.join(t,m),'utf8')); if(j.mode!=='designer') throw new Error(m+' mode='+j.mode); if(fs.readFileSync(p.join(t,r),'utf8').includes('6-Stage Self-Improving Harness Lifecycle')) throw new Error(r+' contains Harness lifecycle');}"
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check conventional commits (new commits only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          node tools/check-commits.mjs "$RANGE"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tools/codex
      - name: Rebuild bundles
        run: |
          node tools/codex/build.mjs
          node tools/claude/build.mjs
      - name: Fail on committed-bundle drift
        run: git diff --exit-code
